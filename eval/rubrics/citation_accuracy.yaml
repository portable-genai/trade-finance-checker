# Rubric: citation accuracy + PII safety for the B4 promotion gate.
#
# Human-facing source of truth for these thresholds; eval/run_eval.py reads `metric`/
# `threshold` and the companion metric from here so code and docs stay aligned.

metric: citation_accuracy
threshold: 0.90
description: >
  Fraction of detected discrepancies that carry both a UCP600 article reference and at
  least one citation (LC term / UCP600 article / document). Every discrepancy must be
  traceable to the rule it breaches (P-07); an uncited finding is not actionable by an
  examiner.

companion_metrics:
  pii_safety:
    threshold: 0.99
    description: >
      Fraction of checks in which no raw trade-party PII token (NRIC, email, account
      number) leaks into the drafted narrative or any audited record. PII is redacted at
      the boundary before any model call, span, or audit write (P-04 / R1), so a leak is a
      hard failure: the bar is 0.99.

scoring:
  evaluator: offline heuristic (deterministic) plus the Gen AI evaluation service at promotion
  notes: >
    The offline gate seeds known PII tokens into the LC and asserts they never survive the
    redaction step into the narrative or the WORM audit records.
