name: CI

# Lint + type-check + tests on the LOCAL profile : a WORKING offline stack (SQLite FTS5
# over UCP600 + deterministic LLM), so CI needs NO Google Cloud credentials and NO
# google-cloud-* packages. Integration tests are deselected.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TRADE_FINANCE_PROFILE: local

jobs:
  lint-type-test:
    name: ruff + mypy + pytest (local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (dev only, no GCP SDK)
        # Proves the domain + onprem profile install and run with no google-cloud-* deps.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock && pip install -e . --no-deps

      - name: Ruff (lint)
        run: ruff check src tests eval scripts

      - name: Ruff (format check)
        run: ruff format --check src tests eval scripts

      - name: Mypy (type-check)
        run: mypy src

      - name: Pytest (unit + contract, integration deselected)
        run: pytest -m 'not integration' -q

      - name: Demo anti-rot and portability proofs
        run: |
          PYTHONPATH=src:tests:scripts python scripts/demo_selftest.py
          PYTHONPATH=src python scripts/portability_demo.py

  supply-chain:
    name: dependency audit (pip-audit + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      # Audit the committed lockfiles so the result matches exactly what CI and the image
      # install. --no-deps: the locks are fully compiled, so audit those exact versions.
      - name: pip-audit (dev + gcp lockfiles)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements-dev.lock --disable-pip --no-deps
          pip-audit -r requirements-gcp.lock --disable-pip --no-deps
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      # A HARD gate, matching the Python side where pip-audit fails the job rather than
      # warning. There is deliberately no allowlist and no expiry date here: an exception with
      # a date in it is an exception that rots silently, and the one this replaced had both
      # expired and been unable to permit the advisory that actually failed the build.
      - name: npm audit (high severity fails the build)
        working-directory: ui
        run: npm audit --audit-level=high

  ui-build:
    name: Next.js console builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install + build the thin console
        # npm audit alone cannot catch a UI-breaking dependency bump; only a real build can.
        working-directory: ui
        run: |
          npm ci
          npm run lint
          npm test
          NEXT_TELEMETRY_DISABLED=1 npm run build

      - name: Assert the built console can hydrate
        # A build proves the bundle compiles, never that the served page runs. This starts the
        # server the build just made and asserts every script tag carries the response nonce,
        # which is the one thing a header assertion cannot see: the header is byte-identical in
        # the working case and in the statically-prerendered case that blocks every script.
        working-directory: ui
        run: npm run assert-hydratable

  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
